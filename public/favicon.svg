<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#178178" />
      <stop offset="100%" stop-color="#2c4964" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle border highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Stylized Diary Pages -->
  <!-- Left Page -->
  <path d="M15 43 C20 40.5 26 40.5 30.5 43 L30.5 21 C26 18.5 20 18.5 15 21 Z" fill="#ffffff" />
  <!-- Right Page -->
  <path d="M49 43 C44 40.5 38 40.5 33.5 43 L33.5 21 C38 18.5 44 18.5 49 21 Z" fill="#ffffff" />
  
  <!-- Subtle page folds / lines -->
  <path d="M18 26 C22 24.5 26 24.5 28 26" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <path d="M18 31 C22 29.5 26 29.5 28 31" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <path d="M36 26 C38 24.5 42 24.5 46 26" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <path d="M36 31 C38 29.5 42 29.5 46 31" stroke="#e2e8f0" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Spine / Center line -->
  <line x1="32" y1="20" x2="32" y2="44" stroke="#178178" stroke-width="2.2" stroke-linecap="round" />

  <!-- Voice Sound Waves (Voice-Enabled AI) -->
  <rect x="30.5" y="8" width="3" height="9" rx="1.5" fill="url(#waveGrad)" filter="url(#glow)" />
  <rect x="24.5" y="10.5" width="2.6" height="6" rx="1.3" fill="url(#waveGrad)" />
  <rect x="37" y="10.5" width="2.6" height="6" rx="1.3" fill="url(#waveGrad)" />
  <rect x="18.5" y="12.5" width="2.2" height="4" rx="1.1" fill="#2dd4bf" opacity="0.9" />
  <rect x="43.5" y="12.5" width="2.2" height="4" rx="1.1" fill="#2dd4bf" opacity="0.9" />

  <!-- Nova Star / Spark of Intelligence -->
  <path d="M32 28 L33.4 31.6 L37 33 L33.4 34.4 L32 38 L30.6 34.4 L27 33 L30.6 31.6 Z" fill="#178178" />
  <circle cx="32" cy="33" r="1.2" fill="#2dd4bf" />

  <!-- Acoustic Arc Smile Base -->
  <path d="M20 48 C27 52 37 52 44 48" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round" />
</svg>
